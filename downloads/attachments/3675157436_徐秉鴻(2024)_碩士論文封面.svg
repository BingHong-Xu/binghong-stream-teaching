      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="850" fill="url(#bg)" rx="16"/>
  <rect x="24" y="24" width="552" height="802" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" rx="12"/>
  
  <text x="300" y="100" text-anchor="middle" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="20" font-weight="600" letter-spacing="4">國立高雄師範大學</text>
  <text x="300" y="135" text-anchor="middle" fill="#cbd5e1" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="500">科學教育暨環境教育研究所</text>
  <text x="300" y="170" text-anchor="middle" fill="url(#gold)" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" letter-spacing="2">碩 士 論 文</text>

  <line x1="120" y1="210" x2="480" y2="210" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Icon / Badge -->
