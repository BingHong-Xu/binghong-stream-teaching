  <text x="300" y="460" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="24" font-weight="800">專題課程之教學實踐研究</text>

  <rect x="180" y="500" width="240" height="36" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5" rx="18"/>
