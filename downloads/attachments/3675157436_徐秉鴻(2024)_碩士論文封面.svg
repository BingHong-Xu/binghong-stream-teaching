  <line x1="120" y1="730" x2="480" y2="730" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="300" y="780" text-anchor="middle" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-size="16">中華民國一一三年七月</text>
